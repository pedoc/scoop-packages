name: Scoop CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up reviewed tooling
        uses: ./.github/actions/setup-scoop
        with:
          test-tools: 'true'
      - name: Test automation and changed manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $paths = ./bin/get-changed-manifests.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA
          ./bin/test.ps1 -Coverage -Analyze -ManifestPathsJson $paths
      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7
